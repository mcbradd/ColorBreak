name: Test and deploy ColorBreak demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify committed price snapshots
        run: npm run check:prices && npm run check:sealed-prices
      - name: Test and build
        run: npm run check
      - name: Report release evidence
        run: |
          node -e "const m=require('./dist/data/release-manifest.json'); console.log('Release manifest:', m.id)"
          node tools/run-root-mjs-tests.mjs --discovery-only
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
