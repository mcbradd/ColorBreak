name: Test and deploy ColorBreak demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify committed price snapshots
        run: npm run check:prices && npm run check:sealed-prices
      - name: Establish release posture
        env:
          COLORBREAK_RELEASE_POSTURE: analysis-only
        run: npm run release:posture
      - name: Test and build
        run: npm run check
      - name: Report release evidence
        run: |
          node -e "const m=require('./dist/data/release-manifest.json'); if (m.releasePosture !== 'analysis-only') throw new Error('Pages artifacts must be analysis-only'); console.log('Release manifest:', m.id)"
          node tools/run-root-mjs-tests.mjs --discovery-only
          echo "Pages artifact posture: analysis-only (GitHub Pages remains a browser-local demo)."
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
