name: Verify production host protections

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: Approved HTTPS production origin to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # This is intentionally not part of the Pages workflow: Pages is the
      # disclosed analysis demo and cannot satisfy these response protections.
      - name: Verify required response headers on every public route
        env:
          COLORBREAK_PRODUCTION_URL: ${{ inputs.production_url }}
        run: npm run test:production-host
