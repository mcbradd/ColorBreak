name: Daily sealed-data audit

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild every supported sealed document
        run: node tools/build-sealed.mjs $(node -e "const i=require('./data/sealed/index.json'); process.stdout.write(i.sets.join(' '))")
      - name: Generate semantic source diff and coverage report
        run: |
          node tools/report-coverage.mjs
          node tools/source-diff.mjs --check --output data/source-diff.json
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-source-audit
          path: |
            data/source-diff.json
            data/coverage.json
